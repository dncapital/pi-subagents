name: CI

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'test/**'
      - 'examples/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vitest.config.*'
      - 'biome.json'
      - '.npmignore'
      - '.github/workflows/**'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      compatibility:
        description: 'Also run the floor and latest Pi compatibility suites'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PI_OFFLINE: '1'
  PI_E2E_LIVE: ''

jobs:
  # One baseline job per relevant PR; no duplicate push run or automatic matrix.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Private Pi state
        run: |
          mkdir -p "$RUNNER_TEMP/pi-subagents-ci"
          chmod 700 "$RUNNER_TEMP/pi-subagents-ci"
          printf 'PI_CODING_AGENT_DIR=%s\n' "$RUNNER_TEMP/pi-subagents-ci" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --reporter=verbose --maxWorkers=2

  # Retain the declared peer-floor guard, but spend its runner time only when requested.
  compat-floor-pi:
    if: github.event_name == 'workflow_dispatch' && inputs.compatibility == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Private Pi state
        run: |
          mkdir -p "$RUNNER_TEMP/pi-subagents-ci"
          chmod 700 "$RUNNER_TEMP/pi-subagents-ci"
          printf 'PI_CODING_AGENT_DIR=%s\n' "$RUNNER_TEMP/pi-subagents-ci" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Install floor Pi
        run: npm install --no-save @earendil-works/pi-coding-agent@0.84.0 @earendil-works/pi-ai@0.84.0 @earendil-works/pi-tui@0.84.0
      - name: Typecheck against floor Pi
        run: npm run typecheck
      - name: Test suite against floor Pi
        run: npm run test -- --reporter=verbose --maxWorkers=2

  # Manual forward canary remains advisory; it does not change the declared peer floor.
  compat-latest-pi:
    if: github.event_name == 'workflow_dispatch' && inputs.compatibility == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Private Pi state
        run: |
          mkdir -p "$RUNNER_TEMP/pi-subagents-ci"
          chmod 700 "$RUNNER_TEMP/pi-subagents-ci"
          printf 'PI_CODING_AGENT_DIR=%s\n' "$RUNNER_TEMP/pi-subagents-ci" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Install current Pi
        run: npm install --no-save @earendil-works/pi-coding-agent@latest @earendil-works/pi-ai@latest @earendil-works/pi-tui@latest
      - name: Typecheck against current Pi
        run: npm run typecheck
      - name: Test suite against current Pi
        run: npm run test -- --reporter=verbose --maxWorkers=2
